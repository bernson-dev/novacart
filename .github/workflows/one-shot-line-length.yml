name: One-shot line length patch

on:
  push:
    branches:
      - fix/emergency-clear-link

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emergency-clear-link
          fetch-depth: 0

      - name: Update OCMOD separator length
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('upload/admin/controller/marketplace/modification.php')
          text = path.read_text(encoding='utf-8')
          old = "\t\t$lineLength = 84;"
          new = "\t\t$lineLength = 78;"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one lineLength=84 occurrence, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY

      - name: PHP syntax check
        run: php -l upload/admin/controller/marketplace/modification.php

      - name: Commit change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-line-length.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload/admin/controller/marketplace/modification.php .github/workflows/one-shot-line-length.yml
          git commit -m "Adjust OCMOD log separator width"
          git push origin HEAD:fix/emergency-clear-link
