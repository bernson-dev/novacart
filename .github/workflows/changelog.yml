name: Changelog

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: changelog-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate changelog entry
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request metadata
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const typeLabels = [
              'Добавлено',
              'Изменено',
              'Исправлено',
              'Безопасность',
              'Не добавлять в CHANGELOG'
            ];

            const checked = typeLabels.filter((label) => {
              const escaped = label.replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&');
              return new RegExp('^- \\[xX\\] ' + escaped + '$', 'm').test(body);
            });

            if (checked.length !== 1) {
              core.setFailed('В разделе «Тип изменения» должен быть отмечен ровно один вариант.');
              return;
            }

            if (checked[0] === 'Не добавлять в CHANGELOG') {
              core.info('PR помечен как технический: запись CHANGELOG не требуется.');
              return;
            }

            const match = body.match(
              /## Запись для CHANGELOG\s*\n[\s\S]*?(?:^|\n)-\s+([^\n<>][^\n]*)/m
            );

            if (!match || !match[1].trim() || match[1].trim() === '-') {
              core.setFailed('Добавьте одну понятную строку в раздел «Запись для CHANGELOG».');
              return;
            }

            core.info('CHANGELOG entry: ' + match[1].trim());

  record:
    name: Record merged change
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read
      issues: write

    steps:
      - name: Update CHANGELOG and PR label
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            const types = [
              {
                text: 'Добавлено',
                prefix: '[+]',
                label: 'changelog:added',
                color: '1f883d',
                description: 'Новое пользовательское или системное поведение'
              },
              {
                text: 'Изменено',
                prefix: '[*]',
                label: 'changelog:changed',
                color: '0969da',
                description: 'Изменение или улучшение существующего поведения'
              },
              {
                text: 'Исправлено',
                prefix: '[#]',
                label: 'changelog:fixed',
                color: 'd29922',
                description: 'Исправление ошибки'
              },
              {
                text: 'Безопасность',
                prefix: '[!]',
                label: 'changelog:security',
                color: 'cf222e',
                description: 'Исправление или улучшение безопасности'
              },
              {
                text: 'Не добавлять в CHANGELOG',
                prefix: '',
                label: 'changelog:skip',
                color: '6e7781',
                description: 'Техническое изменение без записи в пользовательский CHANGELOG'
              }
            ];

            const selected = types.filter((type) => {
              const escaped = type.text.replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&');
              return new RegExp('^- \\[xX\\] ' + escaped + '$', 'm').test(body);
            });

            if (selected.length !== 1) {
              core.setFailed('Невозможно определить тип CHANGELOG: отметьте ровно один вариант в PR.');
              return;
            }

            const type = selected[0];

            // Labels are created lazily so repository setup does not require manual label creation.
            const labels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            if (!labels.some((item) => item.name === type.label)) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: type.label,
                color: type.color,
                description: type.description
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: [type.label]
            });

            if (type.label === 'changelog:skip') {
              core.info('PR #' + pr.number + ' исключён из CHANGELOG.');
              return;
            }

            const entryMatch = body.match(
              /## Запись для CHANGELOG\s*\n[\s\S]*?(?:^|\n)-\s+([^\n<>][^\n]*)/m
            );

            if (!entryMatch || !entryMatch[1].trim() || entryMatch[1].trim() === '-') {
              core.setFailed('Для merged PR отсутствует строка «Запись для CHANGELOG».');
              return;
            }

            const entry = entryMatch[1].trim().replace(/\s+/g, ' ');
            const marker = '<!-- PR #' + pr.number + ' -->';

            const mergedAt = new Date(pr.merged_at);
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Kyiv',
              day: '2-digit',
              month: '2-digit',
              year: 'numeric'
            }).formatToParts(mergedAt);

            const values = Object.fromEntries(parts.map((item) => [item.type, item.value]));
            const date = values.day + '.' + values.month + '.' + values.year;

            async function loadChangelog() {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'CHANGELOG.md',
                ref: pr.base.ref
              });

              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error('CHANGELOG.md не является обычным файлом.');
              }

              return {
                sha: response.data.sha,
                text: Buffer.from(response.data.content, 'base64').toString('utf8')
              };
            }

            function insertEntry(text) {
              if (text.includes(marker)) {
                return null;
              }

              const line = type.prefix + ' ' + entry + ' ' + marker;
              const datePattern = new RegExp(
                '(^|\\n)' + date.replace(/\./g, '\\.') + '\\n',
                'm'
              );
              const dateMatch = datePattern.exec(text);

              if (!dateMatch) {
                return text.replace(/\s*$/, '') + '\n\n' + date + '\n' + line + '\n';
              }

              const sectionStart = dateMatch.index + dateMatch[0].length;
              const rest = text.slice(sectionStart);
              const nextDate = /\n\d{2}\.\d{2}\.\d{4}\n/.exec(rest);
              const insertAt = nextDate
                ? sectionStart + nextDate.index
                : text.replace(/\s*$/, '').length;

              return (
                text.slice(0, insertAt).replace(/\s*$/, '') +
                '\n' + line + '\n\n' +
                text.slice(insertAt).replace(/^\s*/, '')
              );
            }

            for (let attempt = 1; attempt <= 2; attempt++) {
              const current = await loadChangelog();
              const updated = insertEntry(current.text);

              if (updated === null) {
                core.info('CHANGELOG уже содержит запись для PR #' + pr.number + '.');
                return;
              }

              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: 'CHANGELOG.md',
                  branch: pr.base.ref,
                  message: 'docs: update changelog for #' + pr.number,
                  content: Buffer.from(updated, 'utf8').toString('base64'),
                  sha: current.sha
                });

                core.info('CHANGELOG обновлён для PR #' + pr.number + '.');
                return;
              } catch (error) {
                if (attempt === 1 && (error.status === 409 || error.status === 422)) {
                  core.warning('CHANGELOG изменился параллельно, повторяю обновление.');
                  continue;
                }

                throw error;
              }
            }
