name: PHP 7.3 Compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php73:
    name: PHP 7.3 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          tools: composer:v2.2
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -o pipefail
          failed=0

          while IFS= read -r -d '' file; do
            output="$(php -l "$file" 2>&1)" || {
              failed=1
              message="$(printf '%s' "$output" | tr '\n' ' ')"
              echo "::error file=${file}::${message}"
            }
          done < <(
            find upload \
              -type d -path '*/vendor' -prune -o \
              -type f -name '*.php' -print0
          )

          exit "$failed"

      - name: Install PHPCompatibility
        shell: bash
        run: |
          composer global require --no-interaction --no-progress \
            'squizlabs/php_codesniffer:^3.7' \
            'phpcompatibility/php-compatibility:^9.3'

          phpcs --config-set installed_paths "$HOME/.composer/vendor/phpcompatibility/php-compatibility"
          phpcs -i

      - name: PHP 7.3 compatibility check
        shell: bash
        run: |
          set +e

          phpcs \
            --standard=PHPCompatibility \
            --runtime-set testVersion 7.3-7.3 \
            --extensions=php \
            --ignore='*/vendor/*' \
            --report=json \
            upload > /tmp/phpcs.json

          status=$?

          PHP73_REPORT=/tmp/phpcs.json python3 <<'PY'
          import json
          import os

          report_path = os.environ['PHP73_REPORT']

          try:
              with open(report_path, 'r', encoding='utf-8') as fh:
                  report = json.load(fh)
          except Exception as exc:
              print('::error::Unable to read PHPCompatibility report: {}'.format(exc))
              raise SystemExit(2)

          totals = report.get('totals', {})
          files = report.get('files', {})

          print('PHPCompatibility: {} errors, {} warnings in {} files'.format(
              totals.get('errors', 0),
              totals.get('warnings', 0),
              len(files),
          ))

          for path, data in files.items():
              for item in data.get('messages', []):
                  level = 'error' if item.get('type') == 'ERROR' else 'warning'
                  line = int(item.get('line') or 1)
                  column = int(item.get('column') or 1)
                  message = str(item.get('message', '')).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::{} file={},line={},col={}::{}'.format(level, path, line, column, message))
          PY

          exit "$status"
