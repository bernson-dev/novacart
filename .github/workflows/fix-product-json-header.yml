name: Fix Product JSON Header

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-product-json-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: Add JSON content type
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('upload/admin/controller/catalog/product.php')
          source = path.read_text(encoding='utf-8')

          old = "\tpublic function fillEmptyFields() {\n\t\t$this->load->language('catalog/product');"
          new = "\tpublic function fillEmptyFields() {\n\t\t$this->response->addHeader('Content-Type: application/json');\n\t\t$this->load->language('catalog/product');"

          count = source.count(old)
          if count != 1:
              raise SystemExit('Expected exactly one fillEmptyFields() target, found {}'.format(count))

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          php -l upload/admin/controller/catalog/product.php
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/admin/controller/catalog/product.php
          git commit -m 'Set JSON content type for product fill endpoint'
          git push
