name: Fix Installer Safety

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-installer-safety.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none
      - name: Preserve replaced OCMOD on rollback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('upload/admin/controller/marketplace/install.php')
          s = path.read_text(encoding='utf-8')

          old = """\t\t\t\t\t\t\t$modification_info = $this->model_setting_modification->getModificationByCode($code);\n\n\t\t\t\t\t\t\tif ($modification_info) {\n\t\t\t\t\t\t\t\t$this->model_setting_modification->deleteModification($modification_info['modification_id']);\n\t\t\t\t\t\t\t}\n"""
          new = """\t\t\t\t\t\t\t$modification_info = $this->model_setting_modification->getModificationByCode($code);\n\n\t\t\t\t\t\t\tif ($modification_info) {\n\t\t\t\t\t\t\t\t$this->session->data['install_modification_backup'] = $modification_info;\n\t\t\t\t\t\t\t\t$this->model_setting_modification->deleteModification($modification_info['modification_id']);\n\t\t\t\t\t\t\t}\n"""
          if s.count(old) != 1:
              raise SystemExit('modification replacement block not found exactly once')
          s = s.replace(old, new, 1)

          old = """\t\t$this->load->model('setting/modification');\n\t\t$this->model_setting_modification->deleteModificationsByExtensionInstallId($extension_install_id);\n\n\t\tif ($directory && is_dir($directory)) {\n"""
          new = """\t\t$this->load->model('setting/modification');\n\t\t$this->model_setting_modification->deleteModificationsByExtensionInstallId($extension_install_id);\n\n\t\tif (!empty($this->session->data['install_modification_backup']) && is_array($this->session->data['install_modification_backup'])) {\n\t\t\t$backup_modification = $this->session->data['install_modification_backup'];\n\t\t\t$this->model_setting_modification->addModification(array(\n\t\t\t\t'extension_install_id' => isset($backup_modification['extension_install_id']) ? (int)$backup_modification['extension_install_id'] : 0,\n\t\t\t\t'name'                 => isset($backup_modification['name']) ? $backup_modification['name'] : '',\n\t\t\t\t'code'                 => isset($backup_modification['code']) ? $backup_modification['code'] : '',\n\t\t\t\t'author'               => isset($backup_modification['author']) ? $backup_modification['author'] : '',\n\t\t\t\t'version'              => isset($backup_modification['version']) ? $backup_modification['version'] : '',\n\t\t\t\t'link'                 => isset($backup_modification['link']) ? $backup_modification['link'] : '',\n\t\t\t\t'xml'                  => isset($backup_modification['xml']) ? $backup_modification['xml'] : '',\n\t\t\t\t'status'               => isset($backup_modification['status']) ? (int)$backup_modification['status'] : 1\n\t\t\t));\n\t\t}\n\n\t\tif ($directory && is_dir($directory)) {\n"""
          if s.count(old) != 1:
              raise SystemExit('cleanup modification block not found exactly once')
          s = s.replace(old, new, 1)

          old = "unset($this->session->data['install'], $this->session->data['extension_install_id']);"
          new = "unset($this->session->data['install'], $this->session->data['extension_install_id'], $this->session->data['install_modification_backup']);"
          if s.count(old) != 2:
              raise SystemExit('expected two final session cleanup calls, found {}'.format(s.count(old)))
          s = s.replace(old, new)

          path.write_text(s, encoding='utf-8')
          PY

          php -l upload/admin/controller/marketplace/install.php
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/admin/controller/marketplace/install.php
          git commit -m 'Restore replaced OCMOD after failed install'
          git push
