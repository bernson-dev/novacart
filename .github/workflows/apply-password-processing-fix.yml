name: Apply password processing migration fixes

on:
  push:
    branches:
      - fix/password-processing-migration

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-processing-migration
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/apply-password-fix.py

      - name: PHP syntax check
        run: |
          set -e
          git diff --name-only --diff-filter=ACM | grep '\.php$' | while IFS= read -r file; do
            php -l "$file"
          done

      - name: Commit source changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden password processing and legacy migration"
          git push origin HEAD:fix/password-processing-migration
