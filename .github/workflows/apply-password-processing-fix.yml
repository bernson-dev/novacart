name: Apply password processing migration fixes

on:
  push:
    branches:
      - fix/password-processing-migration

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-processing-migration
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          changed = set()

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              p = root / path
              old = p.read_text(encoding='utf-8')
              if text != old:
                  p.write_text(text, encoding='utf-8', newline='')
                  changed.add(path)

          def replace_exact(path, old, new, required=True):
              text = read(path)
              if old not in text:
                  if required:
                      raise RuntimeError('Expected text not found in ' + path + ': ' + old[:120])
                  return
              write(path, text.replace(old, new))

          # 1. Request keeps the historical OpenCart clean() behavior, but exposes
          #    an explicit raw POST accessor for credentials.
          path = 'upload/system/library/request.php'
          text = read(path)
          marker = "\n\t/**\n\t * @param\tarray\t$data\n"
          if 'function getRawPost(' not in text:
              method = """
	/**
	 * Return an original scalar POST value without trim() or HTML encoding.
	 *
	 * This method is intended for credentials and other opaque secrets only.
	 * Ordinary request data must continue to use $this->post.
	 *
	 * @param string $key
	 * @param mixed  $default
	 *
	 * @return mixed
	 */
	public function getRawPost($key, $default = '') {
		if (!array_key_exists($key, $_POST) || !is_string($_POST[$key])) {
			return $default;
		}

		return $_POST[$key];
	}
"""
              if marker not in text:
                  raise RuntimeError('Request insertion marker not found')
              text = text.replace(marker, '\n' + method + marker, 1)
              write(path, text)

          # 2. Remove legacy HTML entity compensation only where a password/secret
          #    is involved. Request-cleaned ordinary fields remain untouched.
          def decode_repl(match):
              expr = match.group(1).strip()
              if expr == "$this->request->post['password']":
                  return "$this->request->getRawPost('password')"
              if expr == "$this->request->post['confirm']":
                  return "$this->request->getRawPost('confirm')"
              if expr == "$this->request->post['db_password']":
                  return "$this->request->getRawPost('db_password')"
              if expr == "$this->request->post['config_mail_smtp_password']":
                  return "$this->request->getRawPost('config_mail_smtp_password')"
              return expr

          decode_rx = re.compile(r"html_entity_decode\(([^\n]+?),\s*ENT_QUOTES,\s*'UTF-8'\)")
          for p in root.joinpath('upload').rglob('*.php'):
              text = p.read_text(encoding='utf-8')
              original = text
              def cb(m):
                  inner = m.group(1)
                  if 'password' in inner or 'confirm' in inner:
                      return decode_repl(m)
                  return m.group(0)
              text = decode_rx.sub(cb, text)
              if text != original:
                  rel = p.as_posix()
                  p.write_text(text, encoding='utf-8', newline='')
                  changed.add(rel)

          # 3. Hash raw passwords in the three account/user models and installer.
          model_paths = [
              'upload/catalog/model/account/customer.php',
              'upload/admin/model/customer/customer.php',
              'upload/admin/model/user/user.php',
              'upload/install/model/install/install.php',
          ]
          for path in model_paths:
              text = read(path)
              text = text.replace(
                  "password_hash($data['password'], PASSWORD_DEFAULT)",
                  "password_hash($this->request->getRawPost('password', $data['password']), PASSWORD_DEFAULT)"
              )
              text = text.replace(
                  "password_hash($password, PASSWORD_DEFAULT)",
                  "password_hash($this->request->getRawPost('password', $password), PASSWORD_DEFAULT)"
              )
              write(path, text)

          # 4. Login libraries always verify the literal submitted password.
          for path, class_table, id_field in [
              ('upload/system/library/cart/customer.php', 'customer', 'customer_id'),
              ('upload/system/library/cart/user.php', 'user', 'user_id'),
          ]:
              text = read(path)
              login_marker = "\tpublic function login("
              pos = text.find(login_marker)
              if pos < 0:
                  raise RuntimeError('login() not found in ' + path)
              brace = text.find('{', pos)
              if brace < 0:
                  raise RuntimeError('login() brace not found in ' + path)
              injection = "\n\t\t$raw_password = $this->request->getRawPost('password', null);\n\n\t\tif ($raw_password !== null) {\n\t\t\t$password = $raw_password;\n\t\t}\n"
              if "$raw_password = $this->request->getRawPost('password', null);" not in text:
                  text = text[:brace + 1] + injection + text[brace + 1:]

              # Constant-time comparisons for legacy hashes.
              text = re.sub(
                  r"\$([a-z_]+)_query->row\['password'\] == sha1\(([^\n]+)\)",
                  r"hash_equals($\1_query->row['password'], sha1(\2))",
                  text
              )
              text = re.sub(
                  r"\$([a-z_]+)_query->row\['password'\] == md5\(\$password\)",
                  r"hash_equals($\1_query->row['password'], md5($password))",
                  text
              )

              # Ensure old VARCHAR(40) dumps can store PASSWORD_DEFAULT hashes.
              if 'private function ensurePasswordColumn()' not in text:
                  helper = f"""
	private function ensurePasswordColumn() {{
		$query = $this->db->query("SHOW COLUMNS FROM `" . DB_PREFIX . "{class_table}` LIKE 'password'");

		if ($query->num_rows && isset($query->row['Type']) && preg_match('/^(?:var)?char\\((\\d+)\\)$/i', $query->row['Type'], $matches) && (int)$matches[1] < 255) {{
			$this->db->query("ALTER TABLE `" . DB_PREFIX . "{class_table}` MODIFY `password` VARCHAR(255) NOT NULL");
		}}
	}}

"""
                  marker = "\tpublic function logout()"
                  if marker not in text:
                      raise RuntimeError('logout marker not found in ' + path)
                  text = text.replace(marker, helper + marker, 1)

              # Expand the column before writing a rehashed legacy password.
              text = text.replace("\t\t\tif ($rehash) {\n\t\t\t\t$this->db->query(", "\t\t\tif ($rehash) {\n\t\t\t\t$this->ensurePasswordColumn();\n\n\t\t\t\t$this->db->query(", 1)
              write(path, text)

          # 5. Password validation must inspect the raw value and reject leading or
          #    trailing trim characters instead of silently changing the password.
          validation_paths = [
              'upload/catalog/controller/account/register.php',
              'upload/catalog/controller/account/password.php',
              'upload/catalog/controller/account/reset.php',
              'upload/catalog/controller/checkout/register.php',
              'upload/admin/controller/customer/customer.php',
              'upload/admin/controller/user/user.php',
              'upload/admin/controller/common/reset.php',
              'upload/install/controller/install/step_3.php',
          ]

          for path in validation_paths:
              text = read(path)

              # Length checks that were not wrapped in html_entity_decode().
              text = text.replace(
                  "utf8_strlen($this->request->post['password'])",
                  "utf8_strlen($this->request->getRawPost('password'))"
              )

              # Exact confirmation comparison.
              text = text.replace(
                  "$this->request->post['password'] != $this->request->post['confirm']",
                  "$this->request->getRawPost('password') !== $this->request->getRawPost('confirm')"
              )
              text = text.replace(
                  "$this->request->post['password'] !== $this->request->post['confirm']",
                  "$this->request->getRawPost('password') !== $this->request->getRawPost('confirm')"
              )

              # Reject edge whitespace as part of the existing password validation.
              # This deliberately does not trim the password.
              rx = re.compile(
                  r"if \(\(utf8_strlen\(\$this->request->getRawPost\('password'\)\) < ([^)]+)\) \|\| \(utf8_strlen\(\$this->request->getRawPost\('password'\)\) > ([^)]+)\)\) \{"
              )
              text = rx.sub(
                  r"if (($this->request->getRawPost('password') !== trim($this->request->getRawPost('password'))) || (utf8_strlen($this->request->getRawPost('password')) < \1) || (utf8_strlen($this->request->getRawPost('password')) > \2)) {",
                  text
              )

              write(path, text)

          # 6. Installer DB password is also an opaque credential.
          step3 = 'upload/install/controller/install/step_3.php'
          text = read(step3)
          text = text.replace(
              "$this->request->post['db_password']",
              "$this->request->getRawPost('db_password')"
          )
          write(step3, text)

          # 7. Preserve raw *_password setting values (SMTP and extension settings)
          #    without changing the Request cleaning semantics for normal settings.
          setting_model = 'upload/admin/model/setting/setting.php'
          text = read(setting_model)
          marker = "\t\tforeach ($data as $key => $value) {\n"
          addition = "\t\tforeach ($data as $key => $value) {\n\t\t\tif (!is_array($value) && stripos($key, 'password') !== false) {\n\t\t\t\t$value = $this->request->getRawPost($key, $value);\n\t\t\t}\n\n"
          if addition not in text:
              if marker not in text:
                  raise RuntimeError('Setting foreach marker not found')
              text = text.replace(marker, addition, 1)
          write(setting_model, text)

          # 8. Sanity checks: password hashing must no longer decode entities.
          offenders = []
          for p in root.joinpath('upload').rglob('*.php'):
              s = p.read_text(encoding='utf-8')
              for line_no, line in enumerate(s.splitlines(), 1):
                  if 'html_entity_decode' in line and ('password' in line or 'confirm' in line):
                      offenders.append(f'{p.as_posix()}:{line_no}: {line.strip()}')
          if offenders:
              raise RuntimeError('Remaining password entity decodes:\n' + '\n'.join(offenders))

          # The temporary workflow deletes itself in the generated commit.
          wf = root / '.github/workflows/apply-password-processing-fix.yml'
          if wf.exists():
              wf.unlink()
              changed.add(wf.as_posix())

          print('Changed files:')
          for path in sorted(changed):
              print(' -', path)
          PY

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          git diff --name-only --diff-filter=ACM | grep '\.php$' | while IFS= read -r file; do
            php -l "$file"
          done

      - name: Commit source changes
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden password processing and legacy migration"
          git push origin HEAD:fix/password-processing-migration
