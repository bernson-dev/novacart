name: Localization Audit

on:
  push:
    branches:
      - main
    paths:
      - 'upload/admin/language/**'
      - 'upload/catalog/language/**'
      - 'upload/install/language/**'
      - 'tools/i18n_audit.php'
      - 'tools/i18n_baseline.txt'
      - '.github/workflows/i18n-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'upload/admin/language/**'
      - 'upload/catalog/language/**'
      - 'upload/install/language/**'
      - 'tools/i18n_audit.php'
      - 'tools/i18n_baseline.txt'
      - '.github/workflows/i18n-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PHP ${{ matrix.php }} localization audit
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.3'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        run: php -l tools/i18n_audit.php

      - name: Localization consistency audit
        run: php tools/i18n_audit.php
