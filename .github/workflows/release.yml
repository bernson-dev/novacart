name: Create Release

on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: 1.0.1 or v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Get release version
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: 1.0.0 or v1.0.0"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG}"
          echo "Release version: ${VERSION}"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Clean release files
        shell: bash
        run: |
          for dir in \
            upload/system/storage/cache \
            upload/system/storage/logs \
            upload/system/storage/session \
            upload/image/cache
          do
            if [[ -d "$dir" ]]; then
              find "$dir" -mindepth 1 -delete
            fi
          done

          find upload -name '.gitkeep' -delete

      - name: Create ZIP archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="novacart-${{ steps.version.outputs.version }}.zip"

          zip -r "$ARCHIVE" upload CHANGELOG.md \
            -x '*/.DS_Store' \
            -x '*/Thumbs.db'

          echo "name=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Created ${ARCHIVE}:"
          ls -lh "$ARCHIVE"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NovaCart ${TAG}" \
            --generate-notes
