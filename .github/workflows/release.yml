name: Create Release

on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: 1.0.1 or v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Get release version
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: 1.0.0 or v1.0.0"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG}"
          echo "Release version: ${VERSION}"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Prepare release files
        shell: bash
        run: |
          runtime_dirs=(
            upload/system/storage/cache
            upload/system/storage/logs
            upload/system/storage/download
            upload/system/storage/upload
            upload/system/storage/modification
            upload/system/storage/session
            upload/image/cache
          )

          for dir in "${runtime_dirs[@]}"; do
            mkdir -p "$dir"

            # Remove generated runtime data, but keep placeholder/security files.
            find "$dir" -mindepth 1 -type f \
              ! -name 'index.html' \
              ! -name '.htaccess' \
              -delete

            find "$dir" -mindepth 1 -type l -delete
            find "$dir" -depth -mindepth 1 -type d -empty -delete

            # Keep the directory non-empty so it survives every ZIP extractor.
            if [[ ! -f "$dir/index.html" ]]; then
              : > "$dir/index.html"
            fi
          done

          find upload -name '.gitkeep' -delete

      - name: Create ZIP archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="novacart-${{ steps.version.outputs.version }}.zip"

          zip -r "$ARCHIVE" upload README.md CHANGELOG.md \
            -x '*/.DS_Store' \
            -x '*/Thumbs.db'

          echo "name=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Created ${ARCHIVE}:"
          ls -lh "$ARCHIVE"

      - name: Verify release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          required_files=(
            README.md
            CHANGELOG.md
            upload/system/storage/cache/index.html
            upload/system/storage/logs/index.html
            upload/system/storage/download/index.html
            upload/system/storage/upload/index.html
            upload/system/storage/modification/index.html
            upload/system/storage/session/index.html
            upload/image/cache/index.html
          )

          archive_entries="$(unzip -Z1 "$ARCHIVE")"

          for file in "${required_files[@]}"; do
            if ! grep -Fxq "$file" <<< "$archive_entries"; then
              echo "Required release path is missing: $file"
              exit 1
            fi
          done

          echo "README, CHANGELOG and required writable directories are present in the release archive."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Replacing ${ARCHIVE}..."
            gh release upload "$TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "$TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NovaCart ${TAG}" \
              --generate-notes
          fi
