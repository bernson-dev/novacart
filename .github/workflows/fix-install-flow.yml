name: Fix Install Flow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-install-flow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: Keep deferred cleanup flag until install directory is gone
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('upload/system/startup.php')
          source = path.read_text(encoding='utf-8')

          old = """\t\t// Удаляем флаг в любом случае, чтобы не пытаться делать это бесконечно\n\t\t@unlink($install_cleanup_flag);\n"""
          new = """\t\t// Удаляем флаг только после фактического удаления каталога.\n\t\t// Если файловая система временно не позволила удалить install,\n\t\t// следующая загрузка магазина повторит очистку.\n\t\tclearstatcache(true, $install_path);\n\n\t\tif (!is_dir($install_path)) {\n\t\t\t@unlink($install_cleanup_flag);\n\t\t}\n"""

          if source.count(old) != 1:
              raise SystemExit('startup cleanup flag block not found')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          php -l upload/system/startup.php
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/system/startup.php
          git commit -m 'Retry deferred install directory cleanup until complete'
          git push
