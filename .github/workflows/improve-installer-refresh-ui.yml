name: Improve Installer Refresh UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/improve-installer-refresh-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply installer UX improvements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # installer controller: two explicit refresh destinations
          path = Path('upload/admin/controller/marketplace/installer.php')
          s = path.read_text(encoding='utf-8')
          old = """\t\t$data['refresh'] = $this->url->link('marketplace/modification/refresh', 'user_token=' . $this->session->data['user_token'] . '&redirect_installer=1', true);\n"""
          new = """\t\t$data['refresh'] = $this->url->link('marketplace/modification/refresh', 'user_token=' . $this->session->data['user_token'] . '&redirect=modification', true);\n\t\t$data['refresh_stay'] = $this->url->link('marketplace/modification/refresh', 'user_token=' . $this->session->data['user_token'] . '&redirect=installer', true);\n\t\t$data['button_refresh_stay'] = $this->language->get('button_refresh_stay');\n"""
          if s.count(old) != 1:
              raise SystemExit('installer refresh link block not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')

          # modification refresh: preserve internal calls, redirect only when requested
          path = Path('upload/admin/controller/marketplace/modification.php')
          s = path.read_text(encoding='utf-8')
          old = """\t\t$url = $this->buildUrl();\n\t\tif (isset($this->request->get['redirect_installer']) && $this->request->get['redirect_installer']) {\n\t\t\t// Intentionally no redirect here; installer renders the refreshed list.\n\t\t}\n\n\t\t$this->deleteEmergencyClearToken();\n"""
          new = """\t\t$url = $this->buildUrl();\n\n\t\t$this->deleteEmergencyClearToken();\n"""
          if s.count(old) != 1:
              raise SystemExit('modification old redirect block not found')
          s = s.replace(old, new, 1)

          old = """\t\t$this->document->addScript('data:text/javascript;charset=utf-8,' . rawurlencode($js));\n\t\t$this->getList();\n\t}\n"""
          new = """\t\t$this->document->addScript('data:text/javascript;charset=utf-8,' . rawurlencode($js));\n\n\t\tif (isset($this->request->get['redirect'])) {\n\t\t\tif ($this->request->get['redirect'] === 'installer') {\n\t\t\t\t$this->response->redirect($this->url->link('marketplace/installer', 'user_token=' . $this->session->data['user_token'], true));\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\tif ($this->request->get['redirect'] === 'modification') {\n\t\t\t\t$this->response->redirect($this->url->link('marketplace/modification', 'user_token=' . $this->session->data['user_token'] . $url, true));\n\t\t\t\treturn;\n\t\t\t}\n\t\t}\n\n\t\t$this->getList();\n\t}\n"""
          if s.count(old) != 1:
              raise SystemExit('modification refresh tail not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')

          # installer template: split refresh button + keep failed queue log visible
          path = Path('upload/admin/view/template/marketplace/installer.twig')
          s = path.read_text(encoding='utf-8')
          old = """            <div class=\"pull-right\">\n                <a href=\"{{ refresh }}\" data-toggle=\"tooltip\" title=\"{{ button_refresh }}\" class=\"btn btn-info\">\n                    <i class=\"fa fa-refresh\"></i></a>\n            </div>\n"""
          new = """            <div class=\"pull-right\">\n                <div class=\"btn-group\">\n                    <a href=\"{{ refresh }}\" data-toggle=\"tooltip\" title=\"{{ button_refresh }}\" class=\"btn btn-info\">\n                        <i class=\"fa fa-refresh\"></i>\n                    </a>\n                    <button type=\"button\" class=\"btn btn-info dropdown-toggle\" data-toggle=\"dropdown\" aria-haspopup=\"true\" aria-expanded=\"false\">\n                        <span class=\"caret\"></span>\n                    </button>\n                    <ul class=\"dropdown-menu dropdown-menu-right\">\n                        <li><a href=\"{{ refresh_stay }}\"><i class=\"fa fa-refresh\"></i> {{ button_refresh_stay }}</a></li>\n                    </ul>\n                </div>\n            </div>\n"""
          if s.count(old) != 1:
              raise SystemExit('installer refresh button block not found')
          s = s.replace(old, new, 1)

          old = """        let fileQueue = [];\n        let fileIndex = 0;\n"""
          new = """        let fileQueue = [];\n        let fileIndex = 0;\n        let queueHasErrors = false;\n"""
          if s.count(old) != 1:
              raise SystemExit('queue vars block not found')
          s = s.replace(old, new, 1)

          old = """            // Сброс интерфейса перед новой загрузкой (до вывода ошибок)\n            resetUI();\n\n            const validFiles = [];\n"""
          new = """            // Сброс интерфейса перед новой загрузкой (до вывода ошибок)\n            resetUI();\n            queueHasErrors = false;\n\n            const validFiles = [];\n"""
          if s.count(old) != 1:
              raise SystemExit('queue reset block not found')
          s = s.replace(old, new, 1)

          old = """                    $('#progress-text').append(\n                    '<div class=\"text-danger\">' +\n"""
          new = """                    queueHasErrors = true;\n                    $('#progress-text').append(\n                    '<div class=\"text-danger\">' +\n"""
          if s.count(old) < 1:
              raise SystemExit('size error block not found')
          s = s.replace(old, new, 1)

          old = """        function finishQueueSuccess() {\n            $('#button-manual-upload').button('reset');\n            $('#progress-bar').addClass('progress-bar-success').css('width', '100%');\n            fileQueue = [];\n            // Сбросим интерфейс после завершения ВСЕЙ очереди\n            setTimeout(resetUI, 5000);\n        }\n"""
          new = """        function finishQueueSuccess() {\n            $('#button-manual-upload').button('reset');\n            fileQueue = [];\n\n            if (queueHasErrors) {\n                $('#progress-bar')\n                .removeClass('progress-bar-success progress-bar-info')\n                .addClass('progress-bar-danger')\n                .css('width', '100%');\n                return;\n            }\n\n            $('#progress-bar')\n            .removeClass('progress-bar-danger progress-bar-info')\n            .addClass('progress-bar-success')\n            .css('width', '100%');\n\n            // При полностью успешной установке лог можно автоматически скрыть.\n            setTimeout(resetUI, 5000);\n        }\n"""
          if s.count(old) != 1:
              raise SystemExit('finishQueueSuccess block not found')
          s = s.replace(old, new, 1)

          # Mark every runtime install error so the final log stays visible.
          patterns = [
              """                    if (json.error) {\n                        $('#' + logId).html(\n""",
              """                error: function(xhr, ajaxOptions, thrownError) {\n                    $('#' + logId).html('<span class=\"text-danger\">' + fileName + ': ' + thrownError + '</span>');\n""",
              """                    if (json.error) {\n                        $('#' + logId).html(\n""",
              """                error: function(xhr, ajaxOptions, thrownError) {\n                    $('#' + logId).html('<span class=\"text-danger\">' + fileName + ': ' + thrownError + '</span>');\n"""
          ]
          # There are two json.error blocks and two ajax error blocks; replace all exact occurrences safely.
          s = s.replace("""                    if (json.error) {\n                        $('#' + logId).html(\n""", """                    if (json.error) {\n                        queueHasErrors = true;\n                        $('#' + logId).html(\n""")
          s = s.replace("""                error: function(xhr, ajaxOptions, thrownError) {\n                    $('#' + logId).html('<span class=\"text-danger\">' + fileName + ': ' + thrownError + '</span>');\n""", """                error: function(xhr, ajaxOptions, thrownError) {\n                    queueHasErrors = true;\n                    $('#' + logId).html('<span class=\"text-danger\">' + fileName + ': ' + thrownError + '</span>');\n""")

          path.write_text(s, encoding='utf-8')

          # Localizations
          lang_values = {
              'upload/admin/language/ru-ru/marketplace/installer.php': "$_['button_refresh_stay']           = 'Обновить и остаться на странице';\n",
              'upload/admin/language/uk-ua/marketplace/installer.php': "$_['button_refresh_stay']           = 'Оновити й залишитися на сторінці';\n",
              'upload/admin/language/en-gb/marketplace/installer.php': "$_['button_refresh_stay']           = 'Refresh and stay on this page';\n",
          }

          for filename, line in lang_values.items():
              path = Path(filename)
              s = path.read_text(encoding='utf-8')
              marker = "// Error\n"
              if marker not in s:
                  raise SystemExit('language marker not found: ' + filename)
              s = s.replace(marker, "// Button\n" + line + "\n" + marker, 1)
              path.write_text(s, encoding='utf-8')
          PY

          php -l upload/admin/controller/marketplace/installer.php
          php -l upload/admin/controller/marketplace/modification.php
          php -l upload/admin/language/ru-ru/marketplace/installer.php
          php -l upload/admin/language/uk-ua/marketplace/installer.php
          php -l upload/admin/language/en-gb/marketplace/installer.php
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/admin/controller/marketplace/installer.php upload/admin/controller/marketplace/modification.php upload/admin/view/template/marketplace/installer.twig upload/admin/language/ru-ru/marketplace/installer.php upload/admin/language/uk-ua/marketplace/installer.php upload/admin/language/en-gb/marketplace/installer.php
          git commit -m 'Improve extension installer refresh and error log UX'
          git push
