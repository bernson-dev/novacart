name: Apply SVG preview refactor

on:
  push:
    paths:
      - '.github/workflows/apply-svg-preview-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          setting = Path('upload/admin/controller/setting/setting.php')
          text = setting.read_text(encoding='utf-8')

          old = """\t\t\tif ($svg) {\n\t\t\t\t$result = $this->model_tool_favicon_generator->generateFromSvg($svg, $store_id, $color, $original);\n\n\t\t\t\tif (!$result) {\n\t\t\t\t\t//$this->session->data['warning'] = 'Favicon не был сгенерирован. Проверьте SVG и наличие Imagick.';\n\t\t\t\t\t$this->session->data['warning'] = $this->language->get('warning_favicon_generate');\n\t\t\t\t}\n\t\t\t} else {"""
          new = """\t\t\tif ($svg) {\n\t\t\t\tif (!class_exists('Imagick')) {\n\t\t\t\t\t$this->session->data['warning'] = $this->language->get('warning_imagick_missing');\n\t\t\t\t} else {\n\t\t\t\t\t$result = $this->model_tool_favicon_generator->generateFromSvg($svg, $store_id, $color, $original);\n\n\t\t\t\t\tif (!$result) {\n\t\t\t\t\t\t$this->session->data['warning'] = $this->language->get('warning_favicon_generate');\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else {"""
          if old not in text:
              raise SystemExit('POST favicon block not found')
          text = text.replace(old, new, 1)

          old = """\t\tif (isset($this->session->data['warning'])) {\n\t\t\t$data['warning'] = $this->session->data['warning'];\n\n\t\t\tunset($this->session->data['warning']);\n\t\t} else {\n\t\t\t$data['warning'] = '';\n\t\t}\n"""
          new = old + """\n\t\tif (!class_exists('Imagick')) {\n\t\t\t$imagick_warning = $this->language->get('warning_imagick_missing');\n\n\t\t\tif ($data['warning']) {\n\t\t\t\tif (strpos($data['warning'], $imagick_warning) === false) {\n\t\t\t\t\t$data['warning'] .= ' ' . $imagick_warning;\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\t$data['warning'] = $imagick_warning;\n\t\t\t}\n\t\t}\n"""
          if old not in text:
              raise SystemExit('warning block not found')
          text = text.replace(old, new, 1)

          old = """\t\t// placeholder 100x100\n\t\t//$data['placeholder'] = $this->model_tool_image->resize('no_image.png', 100, 100);\n\n\t\t// URL предпросмотра SVG с цветом\n\t\t//$data['svg_preview_url'] = $this->url->link('setting/setting/svgPreview', 'user_token=' . $this->session->data['user_token'], true);\n\n\t\t$data['svg_preview_url'] = $this->url->link('tool/svg_preview', 'user_token=' . $this->session->data['user_token'], true);\n\n"""
          new = """\t\t// URL предпросмотра SVG с цветом\n\t\t$data['svg_preview_url'] = $this->url->link('setting/setting/svgPreview', 'user_token=' . $this->session->data['user_token'], true);\n\n"""
          if old not in text:
              raise SystemExit('SVG preview URL block not found')
          text = text.replace(old, new, 1)

          marker = "\tpublic function theme() {"
          method = """\tpublic function svgPreview() {\n\t\tif (\n\t\t\t!isset($this->session->data['user_token']) ||\n\t\t\t!isset($this->request->get['user_token']) ||\n\t\t\t$this->request->get['user_token'] !== $this->session->data['user_token']\n\t\t) {\n\t\t\t$this->response->addHeader('HTTP/1.1 403 Forbidden');\n\t\t\treturn;\n\t\t}\n\n\t\t$path = isset($this->request->get['path']) ? (string)$this->request->get['path'] : '';\n\t\t$color = isset($this->request->get['color']) ? (string)$this->request->get['color'] : '#000000';\n\t\t$original = !empty($this->request->get['original']);\n\n\t\t$this->load->library('svg_preview');\n\n\t\t$svg = $this->svg_preview->render($path, $color, $original);\n\n\t\tif ($svg === false) {\n\t\t\t$this->response->addHeader('HTTP/1.1 404 Not Found');\n\t\t\treturn;\n\t\t}\n\n\t\t$this->response->addHeader('Content-Type: image/svg+xml; charset=utf-8');\n\t\t$this->response->addHeader('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');\n\t\t$this->response->addHeader('Pragma: no-cache');\n\t\t$this->response->setOutput($svg);\n\t}\n\n"""
          if marker not in text:
              raise SystemExit('theme method marker not found')
          if 'public function svgPreview()' not in text:
              text = text.replace(marker, method + marker, 1)

          setting.write_text(text, encoding='utf-8', newline='')

          replacements = {
              Path('upload/admin/language/ru-ru/setting/setting.php'): (
                  "$_['warning_favicon_generate']          = 'Favicon не был сгенерирован. Проверьте SVG и наличие Imagick.';",
                  "$_['warning_favicon_generate']          = 'Не удалось сгенерировать favicon из выбранного SVG.';\n$_['warning_imagick_missing']           = 'PHP-расширение Imagick недоступно. Генерация favicon из SVG работать не будет.';"
              ),
              Path('upload/admin/language/uk-ua/setting/setting.php'): (
                  "$_['warning_favicon_generate']          = 'Favicon не було згенеровано. Перевірте SVG та наявність Imagick.';",
                  "$_['warning_favicon_generate']          = 'Не вдалося згенерувати favicon з вибраного SVG.';\n$_['warning_imagick_missing']           = 'PHP-розширення Imagick недоступне. Генерація favicon з SVG не працюватиме.';"
              ),
          }

          for path, (old, new) in replacements.items():
              data = path.read_text(encoding='utf-8')
              if old not in data:
                  raise SystemExit(f'language marker not found: {path}')
              path.write_text(data.replace(old, new, 1), encoding='utf-8', newline='')

          en = Path('upload/admin/language/en-gb/setting/setting.php')
          data = en.read_text(encoding='utf-8')
          if "$_['warning_imagick_missing']" not in data:
              if not data.endswith('\n'):
                  data += '\n'
              data += "\n$_['warning_favicon_generate']          = 'Failed to generate favicon from the selected SVG.';\n"
              data += "$_['warning_imagick_missing']           = 'The PHP Imagick extension is not available. SVG favicon generation will not work.';\n"
              en.write_text(data, encoding='utf-8', newline='')

          old_controller = Path('upload/admin/controller/tool/svg_preview.php')
          if old_controller.exists():
              old_controller.unlink()
          PY

      - name: PHP syntax check
        run: |
          php -l upload/system/library/svg_preview.php
          php -l upload/admin/controller/setting/setting.php
          php -l upload/admin/language/ru-ru/setting/setting.php
          php -l upload/admin/language/uk-ua/setting/setting.php
          php -l upload/admin/language/en-gb/setting/setting.php

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/admin/controller/setting/setting.php \
                  upload/system/library/svg_preview.php \
                  upload/admin/language/ru-ru/setting/setting.php \
                  upload/admin/language/uk-ua/setting/setting.php \
                  upload/admin/language/en-gb/setting/setting.php \
                  upload/admin/controller/tool/svg_preview.php
          git commit -m 'Refactor SVG preview and detect missing Imagick'
          git push origin HEAD:main
