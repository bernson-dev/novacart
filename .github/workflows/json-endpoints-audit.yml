name: JSON Endpoints Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: AJAX and JSON controller audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: Audit JSON endpoints
        shell: bash
        run: |
          cat > /tmp/audit-json-endpoints.php <<'PHP'
          <?php
          error_reporting(E_ALL);

          $roots = array(
              'upload/admin/controller',
              'upload/catalog/controller'
          );

          $errors = 0;
          $checked = 0;

          function lineOfOffset($source, $offset) {
              return substr_count(substr($source, 0, $offset), "\n") + 1;
          }

          function annotate($file, $line, $message) {
              global $errors;
              $errors++;
              echo 'ISSUE: ' . $file . ':' . (int)$line . ' - ' . $message . PHP_EOL;
              $message = str_replace(array('%', "\r", "\n"), array('%25', '%0D', '%0A'), $message);
              echo '::error file=' . $file . ',line=' . (int)$line . '::' . $message . PHP_EOL;
          }

          foreach ($roots as $root) {
              if (!is_dir($root)) {
                  continue;
              }

              $iterator = new RecursiveIteratorIterator(
                  new RecursiveDirectoryIterator($root, RecursiveDirectoryIterator::SKIP_DOTS)
              );

              foreach ($iterator as $fileInfo) {
                  if (!$fileInfo->isFile() || strtolower($fileInfo->getExtension()) !== 'php') {
                      continue;
                  }

                  $file = str_replace('\\', '/', $fileInfo->getPathname());
                  $source = file_get_contents($file);

                  if ($source === false) {
                      annotate($file, 1, 'Unable to read controller');
                      continue;
                  }

                  $tokens = token_get_all($source);
                  $offset = 0;
                  $count = count($tokens);

                  for ($i = 0; $i < $count; $i++) {
                      $token = $tokens[$i];
                      $text = is_array($token) ? $token[1] : $token;

                      if (!is_array($token) || $token[0] !== T_FUNCTION) {
                          $offset += strlen($text);
                          continue;
                      }

                      $functionOffset = $offset;
                      $name = '';
                      $braceIndex = null;

                      for ($j = $i + 1; $j < $count; $j++) {
                          $part = $tokens[$j];
                          $partText = is_array($part) ? $part[1] : $part;

                          if (is_array($part) && $part[0] === T_STRING && $name === '') {
                              $name = $part[1];
                          }

                          if ($partText === '{') {
                              $braceIndex = $j;
                              break;
                          }

                          if ($partText === ';') {
                              break;
                          }
                      }

                      if ($braceIndex === null || $name === '') {
                          $offset += strlen($text);
                          continue;
                      }

                      $depth = 0;
                      $body = '';
                      $endIndex = $braceIndex;

                      for ($j = $braceIndex; $j < $count; $j++) {
                          $part = $tokens[$j];
                          $partText = is_array($part) ? $part[1] : $part;
                          $body .= $partText;

                          if ($partText === '{') {
                              $depth++;
                          } elseif ($partText === '}') {
                              $depth--;
                              if ($depth === 0) {
                                  $endIndex = $j;
                                  break;
                              }
                          }
                      }

                      $usesJsonResponseHelper = strpos($body, 'jsonResponse(') !== false;
                      $hasJsonHeader = preg_match('/Content-Type\s*:\s*application\\/json/i', $body) === 1;
                      $setsJsonOutput = preg_match('/->setOutput\s*\(\s*json_encode\s*\(/s', $body) === 1;
                      $directOutput = preg_match('/\b(?:echo|print)\b[^;]*json_encode\s*\(/s', $body) === 1;

                      if ($setsJsonOutput && !$hasJsonHeader && !$usesJsonResponseHelper) {
                          annotate(
                              $file,
                              lineOfOffset($source, $functionOffset),
                              'Method ' . $name . '() returns JSON through Response but does not set Content-Type: application/json'
                          );
                      }

                      if ($directOutput) {
                          annotate(
                              $file,
                              lineOfOffset($source, $functionOffset),
                              'Method ' . $name . '() outputs JSON directly with echo/print instead of Response::setOutput()'
                          );
                      }

                      $checked++;
                      $i = $endIndex;

                      $offset = 0;
                      for ($k = 0; $k <= $i; $k++) {
                          $part = $tokens[$k];
                          $offset += strlen(is_array($part) ? $part[1] : $part);
                      }
                  }
              }
          }

          echo 'Audited ' . $checked . ' controller methods; found ' . $errors . ' JSON endpoint issue(s).' . PHP_EOL;
          exit($errors > 0 ? 1 : 0);
          PHP

          php /tmp/audit-json-endpoints.php
