name: PHP Runtime Compatibility

on:
  push:
    branches:
      - main
    paths:
      - 'upload/system/**/*.php'
      - 'upload/image/placeholder.png'
      - 'upload/admin/language/**'
      - 'upload/admin/controller/catalog/product.php'
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/admin/controller/catalog/manufacturer.php'
      - 'upload/admin/controller/catalog/information.php'
      - 'upload/admin/controller/blog/article.php'
      - 'upload/admin/controller/blog/category.php'
      - 'upload/admin/controller/design/seo_url.php'
      - 'upload/admin/model/design/seo_url.php'
      - 'upload/admin/controller/common/header.php'
      - 'upload/admin/view/template/common/header.twig'
      - 'upload/admin/view/javascript/common.js'
      - 'tests/**/*.php'
      - '.github/workflows/php-runtime.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'upload/system/**/*.php'
      - 'upload/image/placeholder.png'
      - 'upload/admin/language/**'
      - 'upload/admin/controller/catalog/product.php'
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/admin/controller/catalog/manufacturer.php'
      - 'upload/admin/controller/catalog/information.php'
      - 'upload/admin/controller/blog/article.php'
      - 'upload/admin/controller/blog/category.php'
      - 'upload/admin/controller/design/seo_url.php'
      - 'upload/admin/model/design/seo_url.php'
      - 'upload/admin/controller/common/header.php'
      - 'upload/admin/view/template/common/header.twig'
      - 'upload/admin/view/javascript/common.js'
      - 'tests/**/*.php'
      - '.github/workflows/php-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: PHP ${{ matrix.php }} runtime smoke
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Core runtime smoke test
        shell: bash
        run: |
          cat > /tmp/novacart-runtime-smoke.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          ini_set('display_errors', '1');

          set_error_handler(function ($severity, $message, $file, $line) {
              if (!(error_reporting() & $severity)) {
                  return false;
              }

              throw new ErrorException($message, 0, $severity, $file, $line);
          });

          $root = getcwd() . '/upload/';
          $runtime = sys_get_temp_dir() . '/novacart-runtime-' . getmypid() . '/';
          $storage = $runtime . 'storage/';
          $modification = $runtime . 'modification/';

          if (!is_dir($storage) && !mkdir($storage, 0777, true) && !is_dir($storage)) {
              throw new RuntimeException('Unable to create temporary storage directory');
          }

          if (!is_dir($modification) && !mkdir($modification, 0777, true) && !is_dir($modification)) {
              throw new RuntimeException('Unable to create temporary modification directory');
          }

          define('DIR_SYSTEM', $root . 'system/');
          define('DIR_APPLICATION', $root . 'admin/');
          define('DIR_IMAGE', $root . 'image/');
          define('DIR_STORAGE', $storage);
          define('DIR_MODIFICATION', $modification);

          require DIR_SYSTEM . 'startup.php';

          function assertSameValue($expected, $actual, $message) {
              if ($expected !== $actual) {
                  throw new RuntimeException($message);
              }
          }

          // Registry: basic set/get/has behavior.
          $registry = new Registry();
          $registry->set('runtime_test', 'ok');
          assertSameValue('ok', $registry->get('runtime_test'), 'Registry::get() failed');
          assertSameValue(true, $registry->has('runtime_test'), 'Registry::has() failed');
          assertSameValue(null, $registry->get('missing_key'), 'Registry missing key behavior changed');

          // Controller: magic access must continue to proxy through Registry without
          // creating deprecated dynamic properties on PHP 8.2+.
          $controller = new class($registry) extends Controller {};
          $controller->runtime_value = 123;
          assertSameValue(123, $controller->runtime_value, 'Controller registry proxy failed');

          // Action: a missing route must fail cleanly and not emit warnings/deprecations.
          $action = new Action('runtime/missing/controller');
          $actionResult = $action->execute($registry);
          if (!($actionResult instanceof Exception)) {
              throw new RuntimeException('Action missing-route behavior changed');
          }

          // Event: empty trigger and registration/unregistration paths.
          $event = new Event($registry);
          assertSameValue(null, $event->trigger('runtime/test'), 'Empty Event::trigger() must return null');
          $event->register('runtime/test', $action, 10);
          $event->unregister('runtime/test', 'runtime/missing/controller');
          $event->clear('runtime/test');

          // Proxy: callback execution and undefined-method exception path.
          $proxy = new Proxy();
          $proxy->runtimeMethod = function ($args) {
              return isset($args[0]) ? $args[0] : null;
          };
          assertSameValue('proxy-ok', $proxy->runtimeMethod('proxy-ok'), 'Proxy callback failed');

          try {
              $proxy->undefinedRuntimeMethod();
              throw new RuntimeException('Proxy undefined method did not throw');
          } catch (BadMethodCallException $e) {
              // Expected.
          }

          // ImageAttributes: standard OpenCart cache URLs must gain intrinsic
          // dimensions without changing existing semantic attributes.
          $html = '<!DOCTYPE html><html><body><img src="/image/cache/catalog/test-300x200.jpg"></body></html>';
          $enhanced = ImageAttributes::enhance($html);
          assertSameValue(true, strpos($enhanced, 'width="300"') !== false, 'Image width was not added');
          assertSameValue(true, strpos($enhanced, 'height="200"') !== false, 'Image height was not added');
          assertSameValue(true, strpos($enhanced, 'alt=""') !== false, 'Missing alt was not added');

          $svg = '<!DOCTYPE html><html><body><img src="/image/cache/catalog/logo-240x80.svg" alt="Store"></body></html>';
          $enhancedSvg = ImageAttributes::enhance($svg);
          assertSameValue(true, strpos($enhancedSvg, 'width="240"') !== false, 'SVG width was not added');
          assertSameValue(true, strpos($enhancedSvg, 'height="80"') !== false, 'SVG height was not added');
          assertSameValue(true, strpos($enhancedSvg, 'alt="Store"') !== false, 'Existing alt was changed');

          // Local non-cache images, such as uploaded logos, must use their real size.
          $placeholderSize = getimagesize(DIR_IMAGE . 'placeholder.png');
          $localLogo = '<!DOCTYPE html><html><body><img src="/image/placeholder.png" alt="Store"></body></html>';
          $enhancedLogo = ImageAttributes::enhance($localLogo);
          assertSameValue(true, strpos($enhancedLogo, 'width="' . (int)$placeholderSize[0] . '"') !== false, 'Local logo width was not added');
          assertSameValue(true, strpos($enhancedLogo, 'height="' . (int)$placeholderSize[1] . '"') !== false, 'Local logo height was not added');

          // Standard OpenCart language flags live outside DIR_IMAGE.
          $flagFile = DIR_APPLICATION . 'language/en-gb/en-gb.png';
          $flagSize = getimagesize($flagFile);
          $flag = '<!DOCTYPE html><html><body><img src="language/en-gb/en-gb.png" alt="English"></body></html>';
          $enhancedFlag = ImageAttributes::enhance($flag);
          assertSameValue(true, strpos($enhancedFlag, 'width="' . (int)$flagSize[0] . '"') !== false, 'Language flag width was not added');
          assertSameValue(true, strpos($enhancedFlag, 'height="' . (int)$flagSize[1] . '"') !== false, 'Language flag height was not added');

          // Generated fallback logo uses a data URI SVG and must keep intrinsic size.
          $dataSvg = 'data:image/svg+xml;charset=UTF-8,' . rawurlencode('<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60"></svg>');
          $dataLogo = '<!DOCTYPE html><html><body><img src="' . $dataSvg . '" alt="Store"></body></html>';
          $enhancedDataLogo = ImageAttributes::enhance($dataLogo);
          assertSameValue(true, strpos($enhancedDataLogo, 'width="220"') !== false, 'Data SVG width was not added');
          assertSameValue(true, strpos($enhancedDataLogo, 'height="60"') !== false, 'Data SVG height was not added');

          // Lazy-load attributes must define the real image dimensions rather than
          // an unrelated placeholder src.
          $lazy = '<!DOCTYPE html><html><body><img src="/image/cache/catalog/placeholder-1x1.jpg" data-src="/image/cache/catalog/product-640x480.jpg"></body></html>';
          $enhancedLazy = ImageAttributes::enhance($lazy);
          assertSameValue(true, strpos($enhancedLazy, 'width="640"') !== false, 'Lazy-load image width was not added');
          assertSameValue(true, strpos($enhancedLazy, 'height="480"') !== false, 'Lazy-load image height was not added');
          assertSameValue(false, strpos($enhancedLazy, 'width="1"') !== false, 'Lazy-load placeholder dimensions were used');

          // Absolute URLs for the current host remain local, while remote hosts
          // must never be resolved against the local DIR_IMAGE tree.
          $_SERVER['HTTP_HOST'] = 'store.test';
          $sameHost = '<!DOCTYPE html><html><body><img src="https://store.test/image/cache/catalog/test-320x180.jpg"></body></html>';
          $enhancedSameHost = ImageAttributes::enhance($sameHost);
          assertSameValue(true, strpos($enhancedSameHost, 'width="320"') !== false, 'Same-host absolute image width was not added');
          assertSameValue(true, strpos($enhancedSameHost, 'height="180"') !== false, 'Same-host absolute image height was not added');

          $remoteHost = '<!DOCTYPE html><html><body><img src="https://cdn.example/image/cache/catalog/test-320x180.jpg"></body></html>';
          $enhancedRemoteHost = ImageAttributes::enhance($remoteHost);
          assertSameValue(false, strpos($enhancedRemoteHost, 'width="320"') !== false, 'Remote image URL was treated as local');
          assertSameValue(false, strpos($enhancedRemoteHost, 'height="180"') !== false, 'Remote image URL was treated as local');

          $custom = '<!DOCTYPE html><html><body><img src="/image/cache/catalog/test-300x200.jpg" width="120" height="80" alt="Custom"></body></html>';
          assertSameValue($custom, ImageAttributes::enhance($custom), 'Existing image dimensions were changed');

          $json = '{"html":"<img src=\"/image/cache/catalog/test-300x200.jpg\">"}';
          assertSameValue($json, ImageAttributes::enhance($json), 'Non-HTML response was modified');

          restore_error_handler();
          echo 'NovaCart core runtime smoke test passed on PHP ' . PHP_VERSION . PHP_EOL;
          PHP

          php \
            -d error_reporting=E_ALL \
            -d display_errors=1 \
            /tmp/novacart-runtime-smoke.php

      - name: SeoPro language regression
        run: php tests/seopro_language_regression.php

      - name: SEO hreflang regression
        run: php tests/seo_hreflang_regression.php

      - name: SEO shared-slug regression
        run: php tests/seo_language_shared_slugs_regression.php

      - name: SEO generator regression
        run: node tests/seo_generator_regression.js

      - name: SEO direct-route canonical regression
        run: php tests/seo_direct_route_canonical_regression.php
